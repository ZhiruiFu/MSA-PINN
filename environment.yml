name: PsiNN

channels:
  - defaults

dependencies:
  - python=3.11
  - pip

  # numerical computing
  - numpy
  - pandas
  - matplotlib
  - scipy

  # common scientific utilities
  - sympy
  - mpmath
  - networkx

  # packaging/runtime
  - setuptools
  - wheel
  - six
  - python-dateutil
  - pytz
  - tzdata
  - packaging

  # optional GUI backend for matplotlib
  # 如果仍然因为 Qt 报错，可以删掉下面这一行
  - pyqt

  - pip:
      - filelock==3.20.3
      - fsspec==2026.1.0
      - jinja2==3.1.6
      - markupsafe==3.0.3
      - typing-extensions==4.15.0